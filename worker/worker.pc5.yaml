# =============================================================================
# Cấu hình Worker Host PC5 (TESTER & SECURITY)
# IP: 26.134.25.163 | Port: 8001
# Control PC1: 26.105.63.241:8000
# =============================================================================

worker_id: "worker-pc5"
machine_id: "PC5"
control_url: "http://26.105.63.241:8000"
secret: "worker_pc5_secret_token_change_me"
listen_host: "0.0.0.0"
listen_port: 8001
contract_version: "1.3.0"
worker_version: "1.0.0"
heartbeat_interval_seconds: 10
outbox_db_path: "worker/data/outbox_pc5.db"

agents:
  - agent_id: "tester-01"
    role: "TESTER"
    name: "Software Tester Agent"
    version: "1.0.0"
    path: "agents/tester"
    capabilities:
      - "create_test_cases"
      - "run_test_suite"
      - "pytest_execution"
      - "verdict_reporting"
  - agent_id: "security-01"
    role: "SECURITY"
    name: "Security Reviewer Agent"
    version: "1.0.0"
    path: "agents/security"
    capabilities:
      - "security_review"
      - "vulnerability_scan"
      - "dependency_check"
      - "secret_leak_detection"
