# =============================================================================
# Cấu hình Worker Host PC5 (SCRUM_MASTER & SECURITY)
# =============================================================================

worker_id: "worker-pc5"
machine_id: "PC5"
control_url: "http://192.168.1.33:8000"
secret: "worker_pc5_secret_token_change_me"
listen_host: "0.0.0.0"
listen_port: 8001
contract_version: "1.3.0"
worker_version: "1.0.0"
heartbeat_interval_seconds: 10
outbox_db_path: "worker/data/outbox_pc5.db"

agents:
  - agent_id: "scrum_master-01"
    role: "SCRUM_MASTER"
    name: "Scrum Master Agent"
    version: "1.0.0"
    path: "agents/scrum_master"
    capabilities:
      - "run_sprint_review"
      - "run_retrospective"
      - "velocity_tracking"
      - "continuous_improvement"
  - agent_id: "security-01"
    role: "SECURITY"
    name: "Security Reviewer Agent"
    version: "1.0.0"
    path: "agents/security"
    capabilities:
      - "security_review"
      - "vulnerability_scan"
      - "dependency_check"
      - "secret_leak_detection"
