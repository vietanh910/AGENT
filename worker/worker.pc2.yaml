# =============================================================================
# Cấu hình Worker Host PC2 (Dev & Scrum Master)
# IP: 26.28.90.248 | Port: 8001
# Control PC1: 26.105.63.241:8000
# =============================================================================

worker_id: "worker-pc2"
machine_id: "PC2"
control_url: "http://26.105.63.241:8000"
secret: "worker_pc2_secret_token_change_me"
listen_host: "0.0.0.0"
listen_port: 8001
contract_version: "1.3.0"
worker_version: "1.0.0"
heartbeat_interval_seconds: 10
outbox_db_path: "worker/data/outbox_pc2.db"

agents:
  - agent_id: "dev-01"
    role: "DEV"
    name: "Developer Agent"
    version: "1.0.0"
    path: "agents/dev"
    capabilities:
      - "implement_project"
      - "implement_feature"
      - "git_workspace"
      - "code_implementation"
  - agent_id: "scrum_master-01"
    role: "SCRUM_MASTER"
    name: "Scrum Master Agent"
    version: "1.0.0"
    path: "agents/scrum_master"
    capabilities:
      - "run_sprint_review"
      - "run_retrospective"
      - "velocity_tracking"
      - "continuous_improvement"
