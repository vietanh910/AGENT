# =============================================================================
# Cấu hình Worker Host PC2 (SA & DBA)
# =============================================================================

worker_id: "worker-pc2"
machine_id: "PC2"
control_url: "http://192.168.1.101:8000"
secret: "worker_pc2_secret_token_change_me"
listen_host: "0.0.0.0"
listen_port: 8000
contract_version: "1.3.0"
worker_version: "1.0.0"
heartbeat_interval_seconds: 10
outbox_db_path: "worker/data/outbox_pc2.db"

agents:
  - agent_id: "sa-01"
    role: "SA"
    name: "Software Architect Agent"
    version: "1.0.0"
    path: "agents/sa"
    capabilities:
      - "design_architecture"
      - "system_architecture"
      - "tech_stack_selection"
      - "interface_design"
  - agent_id: "dba-01"
    role: "DBA"
    name: "Database Administrator Agent"
    version: "1.0.0"
    path: "agents/dba"
    capabilities:
      - "design_schema"
      - "schema_design"
      - "migration_generation"
      - "query_optimization"
