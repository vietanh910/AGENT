# =============================================================================
# Cấu hình Worker Host PC4 (BA & DBA)
# IP: 26.222.181.101 | Port: 8001
# Control PC1: 26.105.63.241:8000
# =============================================================================

worker_id: "worker-pc4"
machine_id: "PC4"
control_url: "http://26.105.63.241:8000"
secret: "worker_pc4_secret_token_change_me"
listen_host: "0.0.0.0"
listen_port: 8001
contract_version: "1.3.0"
worker_version: "1.0.0"
heartbeat_interval_seconds: 10
outbox_db_path: "worker/data/outbox_pc4.db"

agents:
  - agent_id: "ba-01"
    role: "BA"
    name: "Business Analyst Agent"
    version: "1.0.0"
    path: "agents/ba"
    capabilities:
      - "write_requirements"
      - "write_user_stories"
      - "acceptance_criteria"
      - "requirements_analysis"
  - agent_id: "dba-01"
    role: "DBA"
    name: "Database Administrator Agent"
    version: "1.0.0"
    path: "agents/dba"
    capabilities:
      - "design_schema"
      - "schema_design"
      - "migration_generation"
      - "query_optimization"
