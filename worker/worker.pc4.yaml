# =============================================================================
# Cấu hình Worker Host PC4 (DEV & TESTER)
# =============================================================================

worker_id: "worker-pc4"
machine_id: "PC4"
control_url: "http://192.168.1.33:8000"
secret: "worker_pc4_secret_token_change_me"
listen_host: "0.0.0.0"
listen_port: 8001
contract_version: "1.3.0"
worker_version: "1.0.0"
heartbeat_interval_seconds: 10
outbox_db_path: "worker/data/outbox_pc4.db"

agents:
  - agent_id: "dev-01"
    role: "DEV"
    name: "Developer Agent"
    version: "1.0.0"
    path: "agents/dev"
    capabilities:
      - "implement_project"
      - "implement_feature"
      - "git_workspace"
      - "code_implementation"
  - agent_id: "tester-01"
    role: "TESTER"
    name: "Software Tester Agent"
    version: "1.0.0"
    path: "agents/tester"
    capabilities:
      - "create_test_cases"
      - "run_test_suite"
      - "pytest_execution"
      - "verdict_reporting"
