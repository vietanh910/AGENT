# =============================================================================
# Alembic Configuration for Control Node PC1 (MySQL 8.4 LTS)
# =============================================================================

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .

# Default connection to MySQL container
sqlalchemy.url = mysql+pymysql://ai_user:ai_password_change_me@127.0.0.1:3307/ai_team?charset=utf8mb4

# Migration file template
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
